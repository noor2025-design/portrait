<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Portrait</title>
    <link href="assets/icons/favicon.ico" rel="icon" sizes="any" />
    <link href="assets/icons/favicon.svg" rel="icon" type="image/svg+xml" />
    <link href="assets/icons/touch.png" rel="apple-touch-icon" />
    <meta
      property="description"
      content="A web-based interpretation of visual artwork using only HTML, CSS and Javascript exploring how compositions can be reconstructed through code, interaction and responsive design using at Parsons School of Design MPS-CD program at The New School."
    />
    <meta
      content="https://noor2025-design.github.io/portrait/assets/images/og-image.jpg"
      property="og:image"
    />
    <meta
      content="Two striped sections side by side with Movement on the left with a beige striped background showing a grid of yellow squares and green circles, and Motion on the right with a green striped background showing horizontal striped rectangles in green/pink."
      property="og:image:alt"
    />
    <meta name="robots" content="noindex, nofollow" />
    <link href="style.css" rel="stylesheet" />
    <link href="reset.css" rel="stylesheet" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
      rel="stylesheet"
    />
    <script defer src="script.js"></script>
  </head>
  <body>
    <main>
      <section class="movement">
        <header>
          <h1>MOVEMENT</h1>
        </header>
        <article>
          <figure>
            <span class="square"></span>
            <span class="circle"></span>
            <span class="square"></span>
            <span class="circle"></span>
            <span class="square"></span>
            <span class="circle"></span>
            <span class="square"></span>
            <span class="circle"></span>
            <span class="square"></span>
            <span class="circle"></span>
            <span class="square"></span>
            <span class="circle"></span>
            <span class="square"></span>
            <span class="circle"></span>
            <span class="square"></span>
            <span class="circle"></span>
            <span class="square"></span>
            <span class="circle"></span>
            <span class="square"></span>
            <span class="circle"></span>
          </figure>
        </article>
        <footer>
          <p>
            <span
              >Inspired by designer
              <a href="https://tylerspangler.com/personal-work" target="_blank"
                >Tyler Spangler</a
              >,</span
            ><span> "Untitled",</span>
            <span
              >Artwork reference:
              <a
                href="https://www.instagram.com/p/ClEkj97P1Jn/?igsh=ZThpMG1wbjRuNjF4"
                target="_blank"
                >Instagram</a
              ></span
            >
          </p>
        </footer>
      </section>
      <section class="motion">
        <header>
          <h1>MOTION</h1>
        </header>
        <article>
          <figure>
            <div class="figure-background"></div>
            <figcaption>“YOU OWE YOU”</figcaption>
          </figure>
          <figure>
            <div class="figure-background"></div>
            <figcaption>
              <span>"MAKE"</span><span>"SOME"</span><span>"THING"</span>
            </figcaption>
          </figure>
          <figure>
            <div class="figure-background"></div>
            <figcaption>"WAIT, WTF?"</figcaption>
          </figure>
        </article>
        <footer>
          <p>
            <span>
              Inspired by designer
              <a href="https://tylerspangler.com/personal-work" target="_blank"
                >Tyler Spangler</a
              >,</span
            ><span>"Keep Digging",</span>
            <span
              >Artwork reference:
              <a
                href="https://www.instagram.com/p/C46o6dwve0B/?igsh=MWxodTd0MG4zcWd0ZA=="
                target="_blank"
                >Instagram</a
              ></span
            >
          </p>
        </footer>
      </section>
    </main>
  </body>
</html>
